# AUU app locations + headers (included by the HTTPS server). Round 3, 2026-10-01
root /var/www/auu;
index index.html;
server_tokens off;
access_log /var/log/nginx/access.log auu_main;
# fail2ban (auu-nginx-auth) writes deny lines here; real_ip makes them match real clients
include /etc/nginx/auu-banned.conf;
client_max_body_size 64k;
limit_conn auu_conn 40;

# PR #87: refuse odd methods and known scraper / scanner user agents (maps in conf.d/auu-bots.conf).
# Browsers are never matched; the API additionally blocks curl/wget/python etc. on gated routes.
if ($auu_bad_method) { return 405; }
if ($auu_bad_ua) { return 403; }

add_header Strict-Transport-Security "max-age=604800" always;  # step 2 of 3 (1 day -> 1 week -> 6 months)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https://cloudflareinsights.com https://api.mainnet-beta.solana.com https://api.devnet.solana.com; frame-src https://connect.solflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# app sets its session cookie without Secure; nginx 1.18 has no proxy_cookie_flags, so append it via the path attribute
proxy_cookie_path / "/; Secure";

location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
# never serve dotfiles (.git, .env, ...) except ACME challenges
location ~ /\.(?!well-known/) { return 404; }
# scanner probes for server-side scripts / dumps this site never serves
location ~* \.(php\d?|aspx?|jsp|cgi|sql|bak|old|swp|tar|tgz|zip|7z|rar)$ { return 404; }

# strict limit on credential endpoints: 5/min per IP, burst 10
location ~ ^/api/v1/auth/(login|login/totp|register|email/code|password/reset|password)$ {
    limit_req zone=auu_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
location /api/v1/ws {
    limit_conn auu_conn 10;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
}
location /api/ {
    limit_req zone=auu_api burst=60 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
}
location /assets/ { expires 7d; try_files $uri =404; }
location / { try_files $uri /index.html; expires epoch; }  # index.html never cached, so a deploy shows at once
