# AUU bot / method filter maps (http context). PR #87, 2026-10-11.
# Matched UAs get 403 site-wide (auu-app.conf). Real browsers and search engines are not listed;
# an empty User-Agent is refused too.
map $http_user_agent $auu_bad_ua {
    default 0;
    "" 1;
    "~*(scrapy|python-requests|python-urllib|aiohttp|go-http-client|java/|okhttp|apache-httpclient|libwww-perl|httrack|nutch|phantomjs|slimerjs|sqlmap|nikto|nuclei|acunetix|wpscan|zgrab|masscan|nmap|mj12bot|ahrefsbot|semrushbot|dotbot|petalbot|bytespider|gptbot|ccbot|claudebot|dataforseobot|blexbot|serpstatbot)" 1;
}
map $request_method $auu_bad_method {
    default 1;
    "~^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$" 0;
}
