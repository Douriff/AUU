services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      # Mainstream mode (default): public CEX klines + funding, no keys, no orders.
      AUU_LEGACY_PUMP: "off"
      AUU_MAINSTREAM_SYMBOLS: BTC,ETH,SOL
      AUU_MAINSTREAM_EXCHANGE: auto
      DATA_PROVIDER: mock
      # Legacy pump.fun: AUU_LEGACY_PUMP: "on" plus
      # DATA_PROVIDER: pumpfun_paper
      # PUMPFUN_WATCH_MINTS: ""
      # PUMPFUN_DISCOVERY: off
      # PUMPFUN_PORTAL_API_KEY: ""  # env only; ONE token; never commit
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080
      # Live adapter stays disabled. Do not copy secrets/ into the image.
      # Local mount path (gitignored): secrets/live-keypair.json
      AUU_LIVE_ENABLED: "false"
      AUU_LIVE_DISABLED: "true"
      AUU_LIVE_ARMED: "false"
      # Deployed compose turns accounts on. A local process with AUU_AUTH unset stays single-user.
      AUU_AUTH: "on"
      AUU_ALLOW_SIGNUP: "on"
      # Non-custodial wallet stays off. Do not mount a signing key or a keyed RPC URL.
      AUU_WALLET_MODE: "off"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE: ""
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
