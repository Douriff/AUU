services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATA_PROVIDER: mock
      # DATA_PROVIDER: pumpfun_paper
      # PUMPFUN_WATCH_MINTS: ""
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE: ""
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
