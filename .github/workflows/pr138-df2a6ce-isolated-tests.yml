# Purpose: isolated, no-production joint tests of a temporary runner merge of
#   PR139 7f983d3d69455d2f8183fb7f14402e661b83036b
#   PR138 e736bfb867f6abc2e98931ca854d8cad655bc881
# against the real main baseline 3211be8c9821c788ae49c863bb210da06c377d29.
# Start with a one-commit push of this file to branch auu-ci/pr138-df2a6ce
# (not main), at repo path:
#   .github/workflows/pr138-df2a6ce-isolated-tests.yml
# workflow_dispatch is omitted so the first run does not depend on this file
# already being on the default branch.
#
# Checkout is the hardcoded PR139 SHA (fetch-depth: 0), not the CI branch tip.
# Each job then fetches only a missing exact commit SHA (PR138 and, if needed,
# the main baseline), pins a local main ref to 3211be8, and runs
#   git merge --no-commit --no-ff e736bfb867f6abc2e98931ca854d8cad655bc881
# Conflicts fail the job immediately. There is no -X ours/theirs, no rerere,
# and no automatic resolution. A local merge commit is then created with a
# fixed CI identity for artifact metadata only. The same local identity is
# also passed to `git merge --no-commit` (run 44508354790: Git 2.56.1 on
# ubuntu-latest exits 128 with 'empty ident name' before any merge commit,
# with no unmerged paths; that was not a content conflict). It is never pushed. The
# invariant across the api and web jobs is merge_tree (git rev-parse
# HEAD^{tree}), not the merge commit SHA (author/committer timestamps are
# written to metadata and are not forced). Both jobs record merge_tree
# dynamically after the same two-head merge; compare the two recorded
# values — they must match. Do not pin or expect previous joint trees
# a1fcd0a6758863e18d39d77703538789b7ac4185 (06f81be + d3483b79),
# 70251b613fa0efbe0fafa9b73bfb03ec1bc8ee3c (55fcd22 + d3483b79), or
# 100ad48f2058c9587c629f42b37cacf1eed38cde (fe8a457 + d3483b79). Both
# heads change files relative to that last tree, so the new merge_tree
# is recorded dynamically and is not 100ad48.
#
# How to compare merge_tree with a later official GitHub merge:
#   official_tree=$(git rev-parse <official-merge-commit>^{tree})
# official_tree equals this workflow's recorded merge_tree when the
# official merge uses the default merge strategy on the same two heads,
# with no conflict resolution and no extra files. A squash merge can still
# have the same tree; compare trees, not commit SHAs. If main has moved
# past 3211be8, a merge of both PRs into that later main will contain
# additional commits and will not equal this tree. In that case recreate
# the same two-head merge on a detached 7f983d3 and compare HEAD^{tree}.
# A matching tree is not a deploy, not a preview GUI pass, and not
# production sign-off.
#
# No secrets, no exchange keys, no production SSH, no AI/relay calls.
# Dependency install and artifact upload stay on the host network.
# Test/build subprocesses run in a new network namespace (unshare --net,
# loopback only). The runner's global packet filter is not modified.
# sudo is used only to create the netns; tests then run as the looked-up
# runner UID with capabilities dropped. If the namespace cannot be
# established, the job fails closed and does not run tests unisolated.
# Web build dist and the secret-free source tar are uploaded after the
# isolated step (install/build already finished). This workflow does not
# start a preview server, open a browser, or claim a GUI pass.
#
# paramiko==5.1.0 is installed only in this CI test environment. It is not in
# apps/api/requirements.txt or requirements-dev.txt. The earlier cloud
# acceptance run used this version. PyPI (https://pypi.org/pypi/paramiko/5.1.0)
# lists 5.1.0, yanked=false, requires-python>=3.9, Python 3.12 classifier,
# wheel+sdist uploaded 2026-10-18, vulnerabilities=[] at the time of that read.
#
# Action pins are lightweight tags from the official actions/* repos:
#   checkout@v7.0.1, setup-python@v7.1.0, setup-node@v7.1.0, upload-artifact@v7.0.2
#
# Node: use 22, not 20. apps/web/package.json has no engines field. Run
# 44487985877 on Node v20.20.2 showed EBADENGINE for transitive
# react-native@0.87.1 / @react-native/*@0.87.1 requiring
# ^22.13.0 || ^24.3.0 || >=26.0.0, and commander@15.0.0 requiring >=22.12.0.
# The same run failed node scripts/subscription-gate.test.mjs and
# scripts/strategy-gap.test.mjs with ERR_UNKNOWN_FILE_EXTENSION for their
# direct .ts imports (subscription.ts, segmentSeries.ts). Those files use
# only erasable TypeScript (types, interfaces, import type, `as`). Official
# Node 22.18.0+ enables type stripping by default, so the same `node file.mjs`
# commands can load those imports without a new loader, without deleting
# assertions, and without skipping tests.
# https://nodejs.org/en/blog/release/v22.18.0/
# https://nodejs.org/learn/typescript/run-natively
# Production apps/web/Dockerfile stays node:20; this change is CI-only.
#
# AUU_LEGACY_PUMP is intentionally left unset. Product default is off
# (README). The unittest harness (app.data_paths.install_test_isolation)
# does setdefault("AUU_LEGACY_PUMP", "on") so the legacy_pump suite can
# exercise those routes; MainstreamApiTests still build create_app(legacy=False).
# Do not set the flag on or off here just to change the result.
#
# Each test command has its own timeout and unbuffered tee'd progress.
# Isolation stays on; a hang must not sit until the job cap.
#
# Restore drill (ops/backup/auu_backup.py _app_read): APP_API defaults to
# <repo>/apps/api (or $AUU_BACKUP_APP). It execs APP_API/.venv/bin/python -c
# with cwd=APP_API and PYTHONPATH=APP_API. CI creates a real venv at
# apps/api/.venv and runs tests with that interpreter. AUU_BACKUP_APP is left
# unset. Do not symlink a dummy python into a fake .venv.
#
# git show main: baseline (test_ai_review_integrity) needs a local ref named
# main. That ref is pinned to the real 3211be8 baseline, not whatever
# origin/main happens to be if it has moved. origin/main is recorded only.
# HEAD is the local merge commit; main is not checked out.
#
# Locale keys: a remote flatten of zh-CN.json (same algorithm as
# apps/web/scripts/i18n-check.mjs) counted main 1877, PR138 1879,
# previous PR139 head 06f81be 1894, and the previous joint union 1896
# (PR138-only subscribe.accountTitle/accountSub; previous PR139-only
# nav.ai plus the aiReview.board* keys including boardEntry). PR139 head
# 55fcd22 added nav.tabPnl (mobile tab bar), so that joint locale was
# the previous union plus tabPnl. Heads fe8a457 and 7f983d3 do not
# change locales; e736bfb is an API test-only change. The key set is
# unchanged. Both jobs print the merged-tree count from
# that same flatten. The workflow does not pass or fail solely on a
# hardcoded key count, including the previous joint 1896. Web
# `npm run build` still runs i18n-check.mjs, which enforces
# cross-locale parity.
#
# API suite: discover command, assertions, and isolation are unchanged.
# fe8a457 already added one LocaleNamespaceTests case relative to the
# 55fcd22 joint (run 44520074264, 1255 tests). 7f983d3 does not change
# API tests. e736bfb only adds a bounded wait in the existing
# test_connect_failure_rotates_gateways; it does not add, remove, skip,
# or relax the rotation assertions. Do not shrink, skip, or rerun the
# suite.
#
# Board guard: on PR139 head 7f983d3, apps/web/scripts/ai-review-guard.test.mjs
# (blob c6619e808f24b52e6c86bdd581e204ae058f7c5b) is still the board
# open/ask click guard. It reads BoardAiPanel.tsx and asserts the panel
# does not call the model on open and that ask() is behind an explicit
# click. No *board*guard* script exists in apps/web/scripts on this head.
# PR138's copy of ai-review-guard.test.mjs is identical to main, so a
# 3-way merge preview kept the PR139 file cleanly. The web job runs this
# script if it exists after the merge (it must), and also runs any
# additional scripts/*board*guard*.mjs or scripts/*board-ai*.test.mjs
# that are actually present. Head 7f983d3 adds
# scripts/board-ai-sheet.test.mjs, which matches
# scripts/*board-ai*.test.mjs and must be executed. Missing that extra
# on this head is a failure, not an expected skip. Missing unexpected
# extras are not invented and are not treated as a pass.
#
# Source tar exclusions are explicit: .git, .venv, node_modules, .env,
# .env.*, secrets, users, users.json, data, test-logs, *.log, plus the
# web dist (uploaded separately) and bytecode. The archive must not carry
# credentials or stored ledgers. This is not a GUI preview verdict.

name: Isolated joint no-production tests

"on":
  push:
    branches:
      - "auu-ci/pr138-df2a6ce"
    paths:
      - ".github/workflows/pr138-df2a6ce-isolated-tests.yml"

permissions:
  contents: read

jobs:
  api:
    name: API tests on temporary PR139+PR138 merge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only names already documented in docker-compose.yml, apps/api/Dockerfile, or README.
    # AUU_LIVE_API_ENABLE, AUU_AUTH, and AUU_LEGACY_PUMP are left unset on purpose.
    env:
      PYTHONUNBUFFERED: "1"
      DATA_PROVIDER: mock
      AUU_LIVE_ENABLED: "false"
      AUU_LIVE_DISABLED: "true"
      AUU_LIVE_ARMED: "false"
    steps:
      - name: Check out hardcoded PR139 SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7f983d3d69455d2f8183fb7f14402e661b83036b
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact refs, pin main to 3211be8, merge PR138, record tree
        run: |
          set -euo pipefail
          LOGDIR="$GITHUB_WORKSPACE/test-logs"
          mkdir -p "$LOGDIR"
          PR139_SHA="7f983d3d69455d2f8183fb7f14402e661b83036b"
          PR138_SHA="e736bfb867f6abc2e98931ca854d8cad655bc881"
          MAIN_BASE_SHA="3211be8c9821c788ae49c863bb210da06c377d29"

          ensure_commit() {
            local sha="$1"
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "already have $sha"
              return 0
            fi
            echo "missing $sha; fetching exact ref only"
            git fetch --no-tags origin "$sha"
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "failed to fetch exact commit $sha"
              exit 1
            fi
          }

          HEAD_SHA="$(git rev-parse --verify HEAD)"
          if [ "$HEAD_SHA" != "$PR139_SHA" ]; then
            echo "HEAD is not the pinned PR139 SHA: $HEAD_SHA"
            exit 1
          fi

          ensure_commit "$PR138_SHA"
          ensure_commit "$MAIN_BASE_SHA"

          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          fi
          ORIGIN_MAIN_SHA="absent"
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            ORIGIN_MAIN_SHA="$(git rev-parse --verify origin/main)"
          fi

          # Pin local main to the real baseline, not a later origin/main tip.
          git update-ref refs/heads/main "$MAIN_BASE_SHA"
          if [ "$(git rev-parse --verify HEAD)" != "$PR139_SHA" ]; then
            echo "HEAD moved while pinning local main"
            exit 1
          fi
          if [ "$(git rev-parse --verify main)" != "$MAIN_BASE_SHA" ]; then
            echo "local main is not the pinned 3211be8 baseline"
            exit 1
          fi

          # Git 2.56 on ubuntu-latest still requires a committer ident for
          # `merge --no-commit`. Run 44508354790 failed both jobs here with
          # merge_rc=128, unmerged_paths empty, and
          # "fatal: empty ident name ... not allowed". Identity is set only
          # in this local worktree (not --global, not pushed).
          git config user.name "AUU Joint CI"
          git config user.email "auu-joint-ci@localhost"
          git config commit.gpgsign false
          set +e
          git -c user.name="AUU Joint CI" -c user.email="auu-joint-ci@localhost" -c core.editor=true -c rerere.enabled=false -c commit.gpgsign=false merge --no-commit --no-ff "$PR138_SHA" 2>&1 | tee "$LOGDIR/merge-attempt.log"
          merge_rc=${PIPESTATUS[0]}
          set -e
          UNMERGED="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
          {
            echo "pr139_head=$PR139_SHA"
            echo "pr138_head=$PR138_SHA"
            echo "main_base=$MAIN_BASE_SHA"
            echo "origin_main_sha=$ORIGIN_MAIN_SHA"
            echo "merge_rc=$merge_rc"
            echo "unmerged_paths=$UNMERGED"
          } | tee "$LOGDIR/merge-meta.txt"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Merge conflict; failing closed. No -X ours/theirs, no rerere, no auto resolve."
            git status --porcelain | tee -a "$LOGDIR/merge-conflict.log"
            echo "===== unmerged files =====" | tee -a "$LOGDIR/merge-conflict.log"
            git diff --name-only --diff-filter=U | tee -a "$LOGDIR/merge-conflict.log"
            git diff --diff-filter=U | tee -a "$LOGDIR/merge-conflict.log"
            exit 1
          fi
          if [ "$merge_rc" -ne 0 ]; then
            echo "git merge exited $merge_rc with no unmerged paths. This is not a content conflict."
            echo "===== BEGIN complete log merge-attempt.log ====="
            if [ -f "$LOGDIR/merge-attempt.log" ]; then cat "$LOGDIR/merge-attempt.log"; else echo "(missing)"; fi
            echo "===== END complete log merge-attempt.log ====="
            exit 1
          fi

          git -c user.name="AUU Joint CI" -c user.email="auu-joint-ci@localhost" -c commit.gpgsign=false commit --no-verify -m "ci: local unpushed merge of PR139 7f983d3d69455d2f8183fb7f14402e661b83036b with PR138 e736bfb867f6abc2e98931ca854d8cad655bc881"

          MERGE_COMMIT="$(git rev-parse --verify HEAD)"
          MERGE_TREE="$(git rev-parse --verify 'HEAD^{tree}')"
          PARENT1="$(git rev-parse --verify HEAD^1)"
          PARENT2="$(git rev-parse --verify HEAD^2)"
          if [ "$PARENT1" != "$PR139_SHA" ] || [ "$PARENT2" != "$PR138_SHA" ]; then
            echo "merge parents are not PR139 then PR138: $PARENT1 $PARENT2"
            exit 1
          fi

          python3 - <<'PY' | tee "$LOGDIR/locale-count.txt"
          import json
          from pathlib import Path
          def flat(obj, pre=""):
              out = {}
              for k, v in obj.items():
                  key = (pre + "." + k) if pre else k
                  if isinstance(v, dict):
                      out.update(flat(v, key))
                  else:
                      out[key] = v
              return out
          p = Path("apps/web/src/i18n/locales/zh-CN.json")
          print(len(flat(json.loads(p.read_text(encoding="utf-8")))))
          PY
          LOCALE_KEYS="$(tr -d '\n' < "$LOGDIR/locale-count.txt")"

          UTC_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHANGHAI_TS="$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)"
          {
            echo "merge_commit=$MERGE_COMMIT"
            echo "merge_tree=$MERGE_TREE"
            echo "merge_parent1=$PARENT1"
            echo "merge_parent2=$PARENT2"
            echo "locale_zh_cn_keys=$LOCALE_KEYS"
            echo "recorded_at_utc=$UTC_TS"
            echo "recorded_at_asia_shanghai=$SHANGHAI_TS"
            echo "ci_identity=AUU Joint CI <auu-joint-ci@localhost>"
            echo "pushed=false"
          } | tee -a "$LOGDIR/merge-meta.txt"

          TAR_TMP="${RUNNER_TEMP:-/tmp}/auu-joint-source.tar.gz"
          tar -C "$GITHUB_WORKSPACE" -czf "$TAR_TMP" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='secrets' \
            --exclude='users' \
            --exclude='users.json' \
            --exclude='data' \
            --exclude='test-logs' \
            --exclude='*.log' \
            --exclude='apps/web/dist' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.ssh' \
            --exclude='.netrc' \
            --exclude='*.pem' \
            --exclude='*.key' \
            .
          mkdir -p "$GITHUB_WORKSPACE/joint-artifacts"
          TAR_OUT="$GITHUB_WORKSPACE/joint-artifacts/auu-joint-source-${MERGE_TREE:0:12}.tar.gz"
          cp "$TAR_TMP" "$TAR_OUT"
          TAR_SHA="$(sha256sum "$TAR_OUT" | awk '{print $1}')"
          echo "source_tar=$(basename "$TAR_OUT")" | tee -a "$LOGDIR/merge-meta.txt"
          echo "source_tar_sha256=$TAR_SHA" | tee -a "$LOGDIR/merge-meta.txt"
          if tar -tzf "$TAR_OUT" | grep -E '(^|/)\.git(/|$)|(^|/)node_modules(/|$)|(^|/)\.venv(/|$)|(^|/)\.env(/|$)|(^|/)\.env\.[^/]+$|(^|/)secrets(/|$)|(^|/)users(/|$)|(^|/)users\.json$|(^|/)data(/|$)|(^|/)test-logs(/|$)|(^|/)apps/web/dist(/|$)' ; then
            echo "source tar contains a forbidden path"
            exit 1
          fi
          date +%s > "$LOGDIR/merge-ok.flag"
          cat "$LOGDIR/merge-meta.txt" >> "$LOGDIR/meta.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install API test dependencies into apps/api/.venv
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/test-logs"
          VENV="$GITHUB_WORKSPACE/apps/api/.venv"
          VENV_PY="$VENV/bin/python"
          # Real venv at the exact path ops/backup/auu_backup.py _app_read uses:
          # Path(APP_API) / ".venv/bin/python" with APP_API defaulting to
          # <repo>/apps/api. No AUU_BACKUP_APP, no symlink stand-in.
          python -m venv "$VENV"
          test -f "$VENV/pyvenv.cfg"
          test -x "$VENV_PY"
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install -r apps/api/requirements-dev.txt
          # CI-only extra, not a checked-in requirement. See file header.
          "$VENV_PY" -m pip install "paramiko==5.1.0"
          "$VENV_PY" -m pip show paramiko | tee "$GITHUB_WORKSPACE/test-logs/paramiko-show.txt"
          {
            echo "venv=$VENV"
            echo -n "venv_python="
            "$VENV_PY" -c "import sys; print(sys.executable)"
            echo -n "venv_prefix="
            "$VENV_PY" -c "import sys; print(sys.prefix)"
          } | tee -a "$GITHUB_WORKSPACE/test-logs/meta.txt"
          case "$("$VENV_PY" -c "import sys; print(sys.executable)")" in
            */apps/api/.venv/bin/python) ;;
            *) echo "venv interpreter is not apps/api/.venv/bin/python"; exit 1 ;;
          esac

      - name: Run API tests in a loopback-only network namespace
        run: |
          set -u
          LOGDIR="$GITHUB_WORKSPACE/test-logs"
          mkdir -p "$LOGDIR"
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          RUNNER_USER="$(id -un)"
          {
            echo "intended_pr139=7f983d3d69455d2f8183fb7f14402e661b83036b"
            echo "intended_pr138=e736bfb867f6abc2e98931ca854d8cad655bc881"
            echo "intended_main_base=3211be8c9821c788ae49c863bb210da06c377d29"
            echo -n "checked_out_head="
            git -C "$GITHUB_WORKSPACE" rev-parse HEAD
            echo -n "checked_out_tree="
            git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}'
            echo "runner_uid=$RUNNER_UID"
            echo "runner_gid=$RUNNER_GID"
            echo "runner_user=$RUNNER_USER"
          } >> "$LOGDIR/meta.txt"

          VENV_PY="$GITHUB_WORKSPACE/apps/api/.venv/bin/python"
          if [ ! -x "$VENV_PY" ] || [ ! -f "$GITHUB_WORKSPACE/apps/api/.venv/pyvenv.cfg" ]; then
            echo "apps/api/.venv is missing or is not a real venv" >&2
            exit 1
          fi
          {
            echo "export PATH=$(printf '%q' "$GITHUB_WORKSPACE/apps/api/.venv/bin:$PATH")"
            echo "export HOME=$(printf '%q' "$HOME")"
            echo "export LANG=$(printf '%q' "${LANG:-C.UTF-8}")"
            echo "export PYTHONUNBUFFERED=1"
            echo "export DATA_PROVIDER=mock"
            echo "export AUU_LIVE_ENABLED=false"
            echo "export AUU_LIVE_DISABLED=true"
            echo "export AUU_LIVE_ARMED=false"
            echo "export VIRTUAL_ENV=$(printf '%q' "$GITHUB_WORKSPACE/apps/api/.venv")"
            echo "export VENV_PY=$(printf '%q' "$VENV_PY")"
            echo "export GITHUB_WORKSPACE=$(printf '%q' "$GITHUB_WORKSPACE")"
            echo "export LOGDIR=$(printf '%q' "$LOGDIR")"
          } > "$LOGDIR/test-env.sh"

          # Paths are baked in at write time so the script still works after
          # sudo env_reset. Runtime dollars are escaped.
          cat > "$LOGDIR/run-api-tests.sh" << EOF
          #!/bin/bash
          set -u
          . "$LOGDIR/test-env.sh"
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL
          if [ "\$(id -u)" -eq 0 ]; then
            echo "refusing to run tests as root" > "$LOGDIR/netns-error.log"
            exit 92
          fi
          cd "$GITHUB_WORKSPACE/apps/api" || {
            echo "cd apps/api failed" > "$LOGDIR/netns-error.log"
            exit 91
          }
          solo=99
          full=99
          finish() {
            echo "solo_exit=\$solo" >> "$LOGDIR/meta.txt"
            echo "full_exit=\$full" >> "$LOGDIR/meta.txt"
            date +%s > "$LOGDIR/tests-completed.flag"
          }
          trap finish EXIT
          run_timed() {
            local secs="\$1" log="\$2"
            shift 2
            echo "===== BEGIN \$(date -u +%Y-%m-%dT%H:%M:%SZ) timeout=\${secs}s: \$* ====="
            set -o pipefail
            stdbuf -oL -eL timeout --foreground --kill-after=30s "\${secs}s" "\$@" 2>&1 | tee "\$log"
            local rc=\${PIPESTATUS[0]}
            set +o pipefail
            if [ "\$rc" = "124" ]; then
              echo "===== COMMAND TIMED OUT after \${secs}s: \$* ====="
            elif [ "\$rc" = "137" ]; then
              echo "===== COMMAND KILLED after timeout: \$* ====="
            fi
            echo "===== END \$(date -u +%Y-%m-%dT%H:%M:%SZ) exit=\$rc: \$* ====="
            return "\$rc"
          }
          set +e
          run_timed 180 "$LOGDIR/api-health-solo.log" "\$VENV_PY" -u -m unittest tests.test_mainstream_data.MainstreamApiTests.test_health_mainstream_mode -v
          solo=\$?
          run_timed 900 "$LOGDIR/api-full.log" "\$VENV_PY" -u -m unittest discover -s tests -p 'test_*.py' -v
          full=\$?
          set -e
          if [ "\$solo" != "0" ] || [ "\$full" != "0" ]; then
            exit 1
          fi
          EOF
          sed -i 's/^          //' "$LOGDIR/run-api-tests.sh"
          chmod 0755 "$LOGDIR/run-api-tests.sh" "$LOGDIR/test-env.sh"

          cat > "$LOGDIR/enter-netns.sh" << EOF
          #!/bin/bash
          set -euo pipefail
          if ! ip link set lo up > "$LOGDIR/netns-setup.log" 2>&1; then
            echo "ip link set lo up failed" > "$LOGDIR/netns-error.log"
            cat "$LOGDIR/netns-setup.log" >> "$LOGDIR/netns-error.log"
            exit 90
          fi
          if ! ip -o link show lo >> "$LOGDIR/netns-setup.log" 2>&1; then
            echo "ip link show lo failed" > "$LOGDIR/netns-error.log"
            exit 90
          fi
          if ! grep -q "UP" "$LOGDIR/netns-setup.log"; then
            echo "lo is not UP" > "$LOGDIR/netns-error.log"
            cat "$LOGDIR/netns-setup.log" >> "$LOGDIR/netns-error.log"
            exit 90
          fi
          if command -v setpriv >/dev/null 2>&1; then
            exec setpriv --reuid=$RUNNER_UID --regid=$RUNNER_GID --init-groups --inh-caps=-all -- /bin/bash "$LOGDIR/run-api-tests.sh"
          elif command -v runuser >/dev/null 2>&1; then
            exec runuser -u $RUNNER_USER -- /bin/bash "$LOGDIR/run-api-tests.sh"
          else
            echo "no setpriv or runuser to drop privileges" > "$LOGDIR/netns-error.log"
            exit 90
          fi
          EOF
          sed -i 's/^          //' "$LOGDIR/enter-netns.sh"
          chmod 0755 "$LOGDIR/enter-netns.sh"

          set +e
          sudo -n unshare --net /bin/bash "$LOGDIR/enter-netns.sh" 2>&1 | tee "$LOGDIR/netns-outer.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ -f "$LOGDIR/netns-error.log" ] || [ ! -f "$LOGDIR/tests-completed.flag" ]; then
            echo "Namespace setup failed; tests were not run unisolated."
            echo "===== BEGIN complete log netns-error.log ====="
            if [ -f "$LOGDIR/netns-error.log" ]; then cat "$LOGDIR/netns-error.log"; else echo "(missing)"; fi
            echo "===== END complete log netns-error.log ====="
            echo "===== BEGIN complete log netns-outer.log ====="
            if [ -f "$LOGDIR/netns-outer.log" ]; then cat "$LOGDIR/netns-outer.log"; else echo "(missing)"; fi
            echo "===== END complete log netns-outer.log ====="
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            if [ -f "$LOGDIR/api-health-solo.log" ] && ! grep -q '^solo_exit=0$' "$LOGDIR/meta.txt"; then
              echo "===== BEGIN complete log api-health-solo.log ====="
              cat "$LOGDIR/api-health-solo.log"
              echo "===== END complete log api-health-solo.log ====="
            fi
            if [ -f "$LOGDIR/api-full.log" ] && ! grep -q '^full_exit=0$' "$LOGDIR/meta.txt"; then
              echo "===== BEGIN complete log api-full.log ====="
              cat "$LOGDIR/api-full.log"
              echo "===== END complete log api-full.log ====="
            fi
            echo "solo/full exits are in meta.txt; expected failure is still a failure."
            exit 1
          fi

      - name: Upload API test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-logs
          path: test-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload API secret-free source tar
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-joint-source
          path: joint-artifacts/auu-joint-source-*.tar.gz
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Web checks and build on temporary PR139+PR138 merge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out hardcoded PR139 SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7f983d3d69455d2f8183fb7f14402e661b83036b
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact refs, pin main to 3211be8, merge PR138, record tree
        run: |
          set -euo pipefail
          LOGDIR="$GITHUB_WORKSPACE/test-logs"
          mkdir -p "$LOGDIR"
          PR139_SHA="7f983d3d69455d2f8183fb7f14402e661b83036b"
          PR138_SHA="e736bfb867f6abc2e98931ca854d8cad655bc881"
          MAIN_BASE_SHA="3211be8c9821c788ae49c863bb210da06c377d29"

          ensure_commit() {
            local sha="$1"
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "already have $sha"
              return 0
            fi
            echo "missing $sha; fetching exact ref only"
            git fetch --no-tags origin "$sha"
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "failed to fetch exact commit $sha"
              exit 1
            fi
          }

          HEAD_SHA="$(git rev-parse --verify HEAD)"
          if [ "$HEAD_SHA" != "$PR139_SHA" ]; then
            echo "HEAD is not the pinned PR139 SHA: $HEAD_SHA"
            exit 1
          fi

          ensure_commit "$PR138_SHA"
          ensure_commit "$MAIN_BASE_SHA"

          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          fi
          ORIGIN_MAIN_SHA="absent"
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            ORIGIN_MAIN_SHA="$(git rev-parse --verify origin/main)"
          fi

          # Pin local main to the real baseline, not a later origin/main tip.
          git update-ref refs/heads/main "$MAIN_BASE_SHA"
          if [ "$(git rev-parse --verify HEAD)" != "$PR139_SHA" ]; then
            echo "HEAD moved while pinning local main"
            exit 1
          fi
          if [ "$(git rev-parse --verify main)" != "$MAIN_BASE_SHA" ]; then
            echo "local main is not the pinned 3211be8 baseline"
            exit 1
          fi

          # Git 2.56 on ubuntu-latest still requires a committer ident for
          # `merge --no-commit`. Run 44508354790 failed both jobs here with
          # merge_rc=128, unmerged_paths empty, and
          # "fatal: empty ident name ... not allowed". Identity is set only
          # in this local worktree (not --global, not pushed).
          git config user.name "AUU Joint CI"
          git config user.email "auu-joint-ci@localhost"
          git config commit.gpgsign false
          set +e
          git -c user.name="AUU Joint CI" -c user.email="auu-joint-ci@localhost" -c core.editor=true -c rerere.enabled=false -c commit.gpgsign=false merge --no-commit --no-ff "$PR138_SHA" 2>&1 | tee "$LOGDIR/merge-attempt.log"
          merge_rc=${PIPESTATUS[0]}
          set -e
          UNMERGED="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
          {
            echo "pr139_head=$PR139_SHA"
            echo "pr138_head=$PR138_SHA"
            echo "main_base=$MAIN_BASE_SHA"
            echo "origin_main_sha=$ORIGIN_MAIN_SHA"
            echo "merge_rc=$merge_rc"
            echo "unmerged_paths=$UNMERGED"
          } | tee "$LOGDIR/merge-meta.txt"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Merge conflict; failing closed. No -X ours/theirs, no rerere, no auto resolve."
            git status --porcelain | tee -a "$LOGDIR/merge-conflict.log"
            echo "===== unmerged files =====" | tee -a "$LOGDIR/merge-conflict.log"
            git diff --name-only --diff-filter=U | tee -a "$LOGDIR/merge-conflict.log"
            git diff --diff-filter=U | tee -a "$LOGDIR/merge-conflict.log"
            exit 1
          fi
          if [ "$merge_rc" -ne 0 ]; then
            echo "git merge exited $merge_rc with no unmerged paths. This is not a content conflict."
            echo "===== BEGIN complete log merge-attempt.log ====="
            if [ -f "$LOGDIR/merge-attempt.log" ]; then cat "$LOGDIR/merge-attempt.log"; else echo "(missing)"; fi
            echo "===== END complete log merge-attempt.log ====="
            exit 1
          fi

          git -c user.name="AUU Joint CI" -c user.email="auu-joint-ci@localhost" -c commit.gpgsign=false commit --no-verify -m "ci: local unpushed merge of PR139 7f983d3d69455d2f8183fb7f14402e661b83036b with PR138 e736bfb867f6abc2e98931ca854d8cad655bc881"

          MERGE_COMMIT="$(git rev-parse --verify HEAD)"
          MERGE_TREE="$(git rev-parse --verify 'HEAD^{tree}')"
          PARENT1="$(git rev-parse --verify HEAD^1)"
          PARENT2="$(git rev-parse --verify HEAD^2)"
          if [ "$PARENT1" != "$PR139_SHA" ] || [ "$PARENT2" != "$PR138_SHA" ]; then
            echo "merge parents are not PR139 then PR138: $PARENT1 $PARENT2"
            exit 1
          fi

          python3 - <<'PY' | tee "$LOGDIR/locale-count.txt"
          import json
          from pathlib import Path
          def flat(obj, pre=""):
              out = {}
              for k, v in obj.items():
                  key = (pre + "." + k) if pre else k
                  if isinstance(v, dict):
                      out.update(flat(v, key))
                  else:
                      out[key] = v
              return out
          p = Path("apps/web/src/i18n/locales/zh-CN.json")
          print(len(flat(json.loads(p.read_text(encoding="utf-8")))))
          PY
          LOCALE_KEYS="$(tr -d '\n' < "$LOGDIR/locale-count.txt")"

          UTC_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHANGHAI_TS="$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)"
          {
            echo "merge_commit=$MERGE_COMMIT"
            echo "merge_tree=$MERGE_TREE"
            echo "merge_parent1=$PARENT1"
            echo "merge_parent2=$PARENT2"
            echo "locale_zh_cn_keys=$LOCALE_KEYS"
            echo "recorded_at_utc=$UTC_TS"
            echo "recorded_at_asia_shanghai=$SHANGHAI_TS"
            echo "ci_identity=AUU Joint CI <auu-joint-ci@localhost>"
            echo "pushed=false"
          } | tee -a "$LOGDIR/merge-meta.txt"

          TAR_TMP="${RUNNER_TEMP:-/tmp}/auu-joint-source.tar.gz"
          tar -C "$GITHUB_WORKSPACE" -czf "$TAR_TMP" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='secrets' \
            --exclude='users' \
            --exclude='users.json' \
            --exclude='data' \
            --exclude='test-logs' \
            --exclude='*.log' \
            --exclude='apps/web/dist' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.ssh' \
            --exclude='.netrc' \
            --exclude='*.pem' \
            --exclude='*.key' \
            .
          mkdir -p "$GITHUB_WORKSPACE/joint-artifacts"
          TAR_OUT="$GITHUB_WORKSPACE/joint-artifacts/auu-joint-source-${MERGE_TREE:0:12}.tar.gz"
          cp "$TAR_TMP" "$TAR_OUT"
          TAR_SHA="$(sha256sum "$TAR_OUT" | awk '{print $1}')"
          echo "source_tar=$(basename "$TAR_OUT")" | tee -a "$LOGDIR/merge-meta.txt"
          echo "source_tar_sha256=$TAR_SHA" | tee -a "$LOGDIR/merge-meta.txt"
          if tar -tzf "$TAR_OUT" | grep -E '(^|/)\.git(/|$)|(^|/)node_modules(/|$)|(^|/)\.venv(/|$)|(^|/)\.env(/|$)|(^|/)\.env\.[^/]+$|(^|/)secrets(/|$)|(^|/)users(/|$)|(^|/)users\.json$|(^|/)data(/|$)|(^|/)test-logs(/|$)|(^|/)apps/web/dist(/|$)' ; then
            echo "source tar contains a forbidden path"
            exit 1
          fi
          date +%s > "$LOGDIR/merge-ok.flag"
          cat "$LOGDIR/merge-meta.txt" >> "$LOGDIR/web-meta.txt"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: |
          node -v
          npm ci

      - name: Run frontend checks and build in a loopback-only network namespace
        run: |
          set -u
          LOGDIR="$GITHUB_WORKSPACE/test-logs"
          mkdir -p "$LOGDIR"
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          RUNNER_USER="$(id -un)"
          {
            echo "runner_uid=$RUNNER_UID"
            echo "runner_gid=$RUNNER_GID"
            echo "runner_user=$RUNNER_USER"
            echo -n "node_version="
            node -v
            echo -n "checked_out_head="
            git -C "$GITHUB_WORKSPACE" rev-parse HEAD
            echo -n "checked_out_tree="
            git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}'
          } >> "$LOGDIR/web-meta.txt"

          {
            echo "export PATH=$(printf '%q' "$PATH")"
            echo "export HOME=$(printf '%q' "$HOME")"
            echo "export LANG=$(printf '%q' "${LANG:-C.UTF-8}")"
            echo "export GITHUB_WORKSPACE=$(printf '%q' "$GITHUB_WORKSPACE")"
            echo "export LOGDIR=$(printf '%q' "$LOGDIR")"
          } > "$LOGDIR/web-test-env.sh"

          cat > "$LOGDIR/run-web-tests.sh" << EOF
          #!/bin/bash
          set -u
          . "$LOGDIR/web-test-env.sh"
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL
          if [ "\$(id -u)" -eq 0 ]; then
            echo "refusing to run tests as root" > "$LOGDIR/netns-error.log"
            exit 92
          fi
          cd "$GITHUB_WORKSPACE/apps/web" || {
            echo "cd apps/web failed" > "$LOGDIR/netns-error.log"
            exit 91
          }
          r0=99 r1=99 r2=99 r3=99 r4=99 r5=99 r6=99 r7=99
          finish() {
            echo "i18n_check=\$r0" >> "$LOGDIR/web-meta.txt"
            echo "subscription_gate=\$r1" >> "$LOGDIR/web-meta.txt"
            echo "screener_route=\$r2" >> "$LOGDIR/web-meta.txt"
            echo "ai_review_format=\$r3" >> "$LOGDIR/web-meta.txt"
            echo "ai_review_guard=\$r4" >> "$LOGDIR/web-meta.txt"
            echo "strategy_gap=\$r5" >> "$LOGDIR/web-meta.txt"
            echo "extra_board_guard=\$r7" >> "$LOGDIR/web-meta.txt"
            echo "build=\$r6" >> "$LOGDIR/web-meta.txt"
            date +%s > "$LOGDIR/tests-completed.flag"
          }
          trap finish EXIT
          run_timed() {
            local secs="\$1" log="\$2"
            shift 2
            echo "===== BEGIN \$(date -u +%Y-%m-%dT%H:%M:%SZ) timeout=\${secs}s: \$* ====="
            set -o pipefail
            stdbuf -oL -eL timeout --foreground --kill-after=30s "\${secs}s" "\$@" 2>&1 | tee "\$log"
            local rc=\${PIPESTATUS[0]}
            set +o pipefail
            if [ "\$rc" = "124" ] || [ "\$rc" = "137" ]; then
              echo "===== COMMAND STOPPED rc=\$rc after \${secs}s: \$* ====="
            fi
            echo "===== END \$(date -u +%Y-%m-%dT%H:%M:%SZ) exit=\$rc: \$* ====="
            return "\$rc"
          }
          set +e
          run_timed 120 "$LOGDIR/web-i18n-check.log" node scripts/i18n-check.mjs
          r0=\$?
          run_timed 120 "$LOGDIR/web-subscription-gate.log" node scripts/subscription-gate.test.mjs
          r1=\$?
          run_timed 120 "$LOGDIR/web-screener-route.log" node scripts/screener-route.test.mjs
          r2=\$?
          run_timed 120 "$LOGDIR/web-ai-review-format.log" node scripts/ai-review-format.test.mjs
          r3=\$?
          if [ -f scripts/ai-review-guard.test.mjs ]; then
            run_timed 120 "$LOGDIR/web-ai-review-guard.log" node scripts/ai-review-guard.test.mjs
            r4=\$?
          else
            echo "ai-review-guard.test.mjs missing after merge" | tee "$LOGDIR/web-ai-review-guard.log"
            r4=1
          fi
          run_timed 120 "$LOGDIR/web-strategy-gap.log" node scripts/strategy-gap.test.mjs
          r5=\$?
          r7=0
          extra_found=0
          shopt -s nullglob
          for extra in scripts/*board*guard*.mjs scripts/*board-ai*.test.mjs; do
            base=\$(basename "\$extra")
            if [ "\$base" = "ai-review-guard.test.mjs" ]; then
              continue
            fi
            extra_found=1
            run_timed 120 "$LOGDIR/web-extra-\$base.log" node "\$extra"
            erc=\$?
            echo "extra_board_script=\$extra exit=\$erc" >> "$LOGDIR/web-meta.txt"
            if [ "\$erc" != "0" ]; then
              r7=\$erc
            fi
          done
          shopt -u nullglob
          if [ "\$extra_found" = "0" ]; then
            echo "scripts/board-ai-sheet.test.mjs was not collected by scripts/*board-ai*.test.mjs after merge (required on 7f983d3)" | tee "$LOGDIR/web-extra-board-guard.log"
            r7=1
          fi
          run_timed 300 "$LOGDIR/web-build.log" npm run build
          r6=\$?
          set -e
          if [ "\$r0" != "0" ] || [ "\$r1" != "0" ] || [ "\$r2" != "0" ] || [ "\$r3" != "0" ] || [ "\$r4" != "0" ] || [ "\$r5" != "0" ] || [ "\$r7" != "0" ] || [ "\$r6" != "0" ]; then
            exit 1
          fi
          EOF
          sed -i 's/^          //' "$LOGDIR/run-web-tests.sh"
          chmod 0755 "$LOGDIR/run-web-tests.sh" "$LOGDIR/web-test-env.sh"

          cat > "$LOGDIR/enter-netns.sh" << EOF
          #!/bin/bash
          set -euo pipefail
          if ! ip link set lo up > "$LOGDIR/netns-setup.log" 2>&1; then
            echo "ip link set lo up failed" > "$LOGDIR/netns-error.log"
            cat "$LOGDIR/netns-setup.log" >> "$LOGDIR/netns-error.log"
            exit 90
          fi
          if ! ip -o link show lo >> "$LOGDIR/netns-setup.log" 2>&1; then
            echo "ip link show lo failed" > "$LOGDIR/netns-error.log"
            exit 90
          fi
          if ! grep -q "UP" "$LOGDIR/netns-setup.log"; then
            echo "lo is not UP" > "$LOGDIR/netns-error.log"
            cat "$LOGDIR/netns-setup.log" >> "$LOGDIR/netns-error.log"
            exit 90
          fi
          if command -v setpriv >/dev/null 2>&1; then
            exec setpriv --reuid=$RUNNER_UID --regid=$RUNNER_GID --init-groups --inh-caps=-all -- /bin/bash "$LOGDIR/run-web-tests.sh"
          elif command -v runuser >/dev/null 2>&1; then
            exec runuser -u $RUNNER_USER -- /bin/bash "$LOGDIR/run-web-tests.sh"
          else
            echo "no setpriv or runuser to drop privileges" > "$LOGDIR/netns-error.log"
            exit 90
          fi
          EOF
          sed -i 's/^          //' "$LOGDIR/enter-netns.sh"
          chmod 0755 "$LOGDIR/enter-netns.sh"

          set +e
          sudo -n unshare --net /bin/bash "$LOGDIR/enter-netns.sh" 2>&1 | tee "$LOGDIR/netns-outer.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ -f "$LOGDIR/netns-error.log" ] || [ ! -f "$LOGDIR/tests-completed.flag" ]; then
            echo "Namespace setup failed; tests were not run unisolated."
            echo "===== BEGIN complete log netns-error.log ====="
            if [ -f "$LOGDIR/netns-error.log" ]; then cat "$LOGDIR/netns-error.log"; else echo "(missing)"; fi
            echo "===== END complete log netns-error.log ====="
            echo "===== BEGIN complete log netns-outer.log ====="
            if [ -f "$LOGDIR/netns-outer.log" ]; then cat "$LOGDIR/netns-outer.log"; else echo "(missing)"; fi
            echo "===== END complete log netns-outer.log ====="
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            for file in web-i18n-check.log web-subscription-gate.log web-screener-route.log web-ai-review-format.log web-ai-review-guard.log web-strategy-gap.log web-extra-board-guard.log web-build.log; do
              echo "===== BEGIN complete log $file ====="
              if [ -f "$LOGDIR/$file" ]; then cat "$LOGDIR/$file"; else echo "(missing)"; fi
              echo "===== END complete log $file ====="
            done
            shopt -s nullglob
            for file in "$LOGDIR"/web-extra-*.log; do
              echo "===== BEGIN complete log $(basename "$file") ====="
              cat "$file"
              echo "===== END complete log $(basename "$file") ====="
            done
            shopt -u nullglob
            exit 1
          fi

      - name: Upload web test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-logs
          path: test-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload web secret-free source tar
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-joint-source
          path: joint-artifacts/auu-joint-source-*.tar.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload web build dist
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14
